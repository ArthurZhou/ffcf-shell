[package]
name = "cf-ip-optimizer"
version = "0.1.0"
description = "Cloudflare IP Optimizer desktop app (Tauri v2)"
edition = "2021"

[lib]
name = "cf_ip_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-cf-optimizer = { path = "../crates/tauri-plugin-cf-optimizer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
